[tool.ruff]
select = ["E", "F", "B"]
ignore = ["E501"]
unfixable = ["B"]
target-version = "py310"
ignore-init-module-imports = true


[tool.black]
target-version = ["py310"]


[tool.mypy]
python_version = "3.10"
files = "bot.py"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true


[project]
name = "aiogram-bot-template"
version = "2.0.0"
description = "Template for creating scalable bots with aiogram"
authors = [{name = "Forden", email = "24463229+Forden@users.noreply.github.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "environs>=9.5.0,<10",
    "aiohttp>=3.8.4,<4",
    "aiojobs>=1.1.0,<2",
    "aiogram==3.0.0b7",
    "asyncpg>=0.27.0,<0.28",
    "redis>=4.5.5,<5",
    "orjson>=3.8.12,<4",
    "structlog>=23.1.0,<24",
]

[dependency-groups]
dev = [
    "mypy>=1.3.0,<2",
    "black[d]>=23.3.0,<24",
    "ruff>=0.0.267,<0.0.268",
    "types-redis>=4.5.5.2,<5",
]

[tool.uv]
default-groups = []  # dev group opt-in, as it was with poetry
constraint-dependencies = ["marshmallow<4"]  # environs 9.x breaks on marshmallow 4
