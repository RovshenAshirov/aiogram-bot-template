[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
unfixable = ["B"]

[tool.black]
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
files = "bot.py"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[project]
name = "aiogram-bot-template"
version = "2.0.0"
description = "Template for creating scalable bots with aiogram"
authors = [{name = "Rovshen Ashirov", email = "rovshenashirov1619@gmail.com"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp>=3.14.3",
    "aiojobs>=1.4.0",
    "asyncpg>=0.31.0",
    "environs>=15.2.0",
    "orjson>=3.12.0",
    "redis>=8.1.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "black[d]>=26.5.1",
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]

[tool.uv]
default-groups = []  # dev group opt-in
